batch_size: 1
iters: 10000

model:
  type: OCRNet
  backbone:
    type: HRNet_W18
    in_channels: 2
  num_classes: 2
  backbone_indices: [0]
  pretrained: https://bj.bcebos.com/paddleseg/dygraph/cityscapes/ocrnet_hrnetw18_cityscapes_1024x512_160k/model.pdparams

train_dataset:
  type: Dataset
  dataset_root: data/train
  train_path: data/train/train.txt
  num_classes: 2
  img_channels: 2
  mode: train
  transforms:
    - type: Resize
      target_size: [1024, 1024]
    - type: Normalize

val_dataset:
  type: Dataset
  dataset_root: data/train
  val_path: data/train/val.txt
  num_classes: 2
  img_channels: 2
  mode: val
  transforms:
    - type: Resize
      target_size: [1024, 1024]
    - type: Normalize

optimizer:
  type: Adam
  weight_decay: 4.0e-5

lr_scheduler:
  type: PolynomialDecay
  learning_rate: 0.01
  end_lr: 1.0e-6
  power: 0.9
  warmup_iters: 1000
  warmup_start_lr: 1.0e-6

loss:
  types:
    - type: BCELoss
      pos_weight: dynamic
  coef: [1, 1]
